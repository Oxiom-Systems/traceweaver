process_budget:
  target_total_effort_percent: 20
  hard_ceiling_total_effort_percent: 50
  target_process_to_delivery_ratio_percent: 25
  hard_ceiling_process_to_delivery_ratio_percent: 100
  estimated_delivery_minutes: 300
  estimated_process_target_minutes: 75
  estimated_process_ceiling_minutes: 300

selected_controls:
  - accepted_promoted_authority_and_scoped_review
  - one_consolidated_implementation_gate_plan
  - full_l3_vv_definition_with_red_evidence
  - deterministic_offline_positive_and_adversarial_fixtures
  - independent_signature_trust_and_privacy_boundary
  - exact_cell_qualification_and_claim_holds
  - one_independent_reviewer
  - one_repair_cycle_cap
  - traceability_and_graph_freshness_closure

permitted_process_children:
  planner: { wrapper: tw-plan, model: gpt-5.6-terra, reasoning_effort: xhigh, maximum_timebox_minutes: 25, category: process }
  document_reviewer: { wrapper: tw-doc-review, model: gpt-5.6-terra, reasoning_effort: xhigh, maximum_timebox_minutes: 20, category: process }
  vv_definer: { wrapper: tw-vv-define, model: gpt-5.6-terra, reasoning_effort: xhigh, maximum_timebox_minutes: 25, category: process }
  authority_gate: { wrapper: tw-authority-gate, model: gpt-5.6-terra, reasoning_effort: xhigh, maximum_timebox_minutes: 10, category: process }
  traceability_checker: { wrapper: tw-traceability-check, model: gpt-5.6-terra, reasoning_effort: xhigh, maximum_timebox_minutes: 20, category: process }

child_roles:
  builder: { model: gpt-5.6-terra, reasoning_effort: xhigh, maximum_timebox_minutes: 180 }
  verifier: { model: gpt-5.6-terra, reasoning_effort: xhigh, maximum_timebox_minutes: 60 }
  reviewer: { model: gpt-5.6-terra, reasoning_effort: xhigh, maximum_timebox_minutes: 30 }
  deployer: { model: not_applicable, maximum_timebox_minutes: 0 }
  dogfooder: { model: not_applicable, maximum_timebox_minutes: 0 }

model_selection:
  availability: [current coordinator session, native subagent request surface exposes gpt-5.6-terra]
  choice: current coordinator routes bounded gpt-5.6-terra xhigh children; served-model identity remains unattested and is never metric-qualification evidence
  rationale: Preserves the released 0.5.0 main/child governance while the harness is built; deterministic repository verification, not child self-attestation, decides artifact acceptance.
  unavailable_consequence: held_model_unavailable; no silent fallback

reviewer_cap: 1
repair_cycle_cap: 1
severe_blocker_exception_cycle_cap: 0
requires_deploy: false
requires_chrome_dogfood: false

high_risk_controls:
  rollback: Reverse only task-specific unstaged harness, fixture, plan, V&V, and trace edits while preserving the pre-existing staged metric-authority promotion; no runtime or external state is changed.
  owner_decision: Oxiom Systems /tw-auto direction on 2026-08-23 constrained by TW-METRIC-ROUTING-ENVELOPE-2026-08-22-001
  held_claims: [provider_replay, host_metric_collection, external_spend, quantitative_savings, quality_equivalence, observed_sufficiency, qualified_route, publication, release, active_cutover]

profile_hash_algorithm: sha256-canonical-json-v1
profile_hash_excluded_top_level_fields: [profile_hash, profile_status, accounting]
immutable_after_building:
  fields: [schema_version, task_id, profile_revision, risk, selection_rationale, authority_binding, governance_profile, process_budget, selected_controls, permitted_process_children, child_roles, model_selection, reviewer_cap, repair_cycle_cap, severe_blocker_exception_cycle_cap, requires_deploy, requires_chrome_dogfood, high_risk_controls, profile_hash_algorithm, profile_hash_excluded_top_level_fields, immutable_after_building, profile_hash]
  expansion_rule: After the first builder dispatch, create a new profile revision with an owner-approved escalation reason; never silently add scope, control, reviewer, model, provider replay, publication, or cutover behavior.
profile_hash: sha256:de1b8121909d9f7c2fdedaa637e6f812ed83b8a88459dc886e627df5cc5bbeef

