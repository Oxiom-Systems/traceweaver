# TRACEWEAVER: file-role=review-series-loop-state-template; req=REQ-TW-037,REQ-TW-056,REQ-TW-057; trace=TRACE-TW-067; ver=VER-TW-087
schema_version: tw-auto-loop-state/3
traceweaver_mode: advisory
status: selecting_workflow_profile

workflow_profile:
  path: .traceweaver/workflow-profile.yml
  risk: "<L0|L1|L2|L3>"
  profile_revision: 1
  profile_hash: "sha256:<canonical-profile-hash>"
  status: planned
  escalation_reason: null
  immutable_after_first_builder_dispatch: true

review_series:
  ledger_schema: tw-review-series-ledger/1
  ledger_dir: .traceweaver/review-series
  series_generation_id: "<RS-GEN-ID>"
  predecessor_series_identity: null
  series_identity: "sha256:<series-identity>"
  frozen_scope_identity: "sha256:<routing-scope-identity>"
  policy_epoch: tw-review-policy/2026-08-21
  stage: discovery
  attempt_identity: null
  dispatch_identities: []
  reviewer_dispatch_cap_per_attempt: 1
  routine_repair_cycle_limit: 1
  severe_blocker_exception_cycle_cap: 1
  absolute_repair_cycle_limit: 2
  remaining_repair_cycles: 1
  severe_blocker_exception: null
  unresolved_blocking_fingerprints: []
  relevant_evidence_digest: null
  accepted_review_identity: null
  review_terminal_outcome: null
  authority_acceptance_state: held_authority_acceptance

accounting:
  observer: orchestration_harness
  clock: monotonic
  fixed_categories: [process, delivery, unclassified]
  unclassified_rule: counts_as_process_until_reviewer_resolves
  target_total_effort_percent: 20
  hard_ceiling_total_effort_percent: 50
  target_process_to_delivery_ratio_percent: 25
  hard_ceiling_process_to_delivery_ratio_percent: 100
  estimated_delivery_minutes: 0
  estimated_process_target_minutes: 0
  estimated_process_ceiling_minutes: 0
  actual_process_minutes: 0
  actual_delivery_minutes: 0
  actual_unclassified_minutes: 0
  receipts: []
  target_action: stop_optional_artifacts_and_duplicate_review
  hard_ceiling_action: held_process_budget

dispatch:
  current_child: null
  current_child_category: null
  current_child_maximum_timebox_minutes: 0
  next_projected_process_minutes: 0
  next_projected_delivery_minutes: 0
  refusal: null

stop:
  stopped: false
  stop_reason: null
  human_decision_required: false
  terminal_result: pending

next_recommended_step: "create or resume the authorized review series before any review-bearing dispatch"
