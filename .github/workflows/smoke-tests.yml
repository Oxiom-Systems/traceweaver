# TRACEWEAVER: file-role=code-traceability-ci-workflow; req=REQ-TW-054; trace=TRACE-TW-032; ver=VER-TW-041
# TRACEWEAVER: verifies=VER-TW-087; req=REQ-TW-037,REQ-TW-056,REQ-TW-057; trace=TRACE-TW-067
# TRACEWEAVER: verifies=VER-TW-092; req=REQ-TW-109,REQ-TW-122; trace=TRACE-TW-072
# TRACEWEAVER: verifies=VER-TW-093; req=REQ-TW-124,REQ-TW-125,REQ-TW-126,REQ-TW-127,REQ-TW-128,REQ-TW-129; trace=TRACE-TW-073
name: Smoke tests

# Runs the TraceWeaver discovery/traceability smokes on pull requests and on
# pushes to main. Includes the Codex discovery smoke, which needs the Codex CLI
# and bun (both installed via npm). ruby, python3, jq, and perl are preinstalled
# on ubuntu-latest.
#
# Intentionally excluded:
# - scripts/traceweaver-audit-plugin-scope — its hash baseline
#   (docs/validation/traceweaver-controlled-autonomy-alpha.md) is currently
#   drifted on main for files unrelated to any recent release; add it here once
#   that baseline is reconciled by the release gate.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: smoke-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bun and the Codex CLI
        run: |
          npm install -g bun @openai/codex
          echo "bun: $(bun --version)"
          echo "codex: $(codex --version)"

      - name: Skill Execution Contract smoke
        run: scripts/traceweaver-smoke-skill-execution-contract

      - name: Shadow model-context routing smoke
        run: scripts/traceweaver-smoke-model-context-routing

      - name: Deterministic metric-routing harness smoke
        run: scripts/traceweaver-smoke-metric-routing-harness

      - name: Deterministic metric-routing atomic replay regression
        run: |
          ruby --disable-gems - <<'RUBY'
          require "json"
          require "rbconfig"
          require "tmpdir"

          root = Dir.pwd
          evaluator = File.join(root, "plugins/traceweaver-core/skills/tw-auto/scripts/traceweaver-evaluate-metric-routing")
          fixtures = %w[
            fixtures/metric-routing-harness/collector-trust.yml
            fixtures/metric-routing-harness/observation-valid.json
            fixtures/metric-routing-harness/attestation-valid.json
          ].join(",")

          wave = lambda do |prefill_bytes|
            Dir.mktmpdir("traceweaver-metric-routing-") do |state|
              ledger = File.join(state, "attestation-replay-ledger.jsonl")
              line = "noise-ledger-entry-not-an-attestation\n"
              File.binwrite(ledger, line * (prefill_bytes / line.bytesize)) if prefill_bytes.positive?
              initial_lines = File.exist?(ledger) ? File.foreach(ledger).count : 0
              gate_reader, gate_writer = IO.pipe
              pids = 24.times.map do |index|
                fork do
                  gate_writer.close
                  gate_reader.read(1)
                  STDOUT.reopen(File.join(state, "out-#{index}.json"), "wb")
                  STDERR.reopen(File.join(state, "err-#{index}.txt"), "wb")
                  environment = {"HOME" => state, "TMPDIR" => state, "LANG" => "C", "LC_ALL" => "C", "TZ" => "UTC", "TRACEWEAVER_OFFLINE" => "1"}
                  exec(environment, RbConfig.ruby, "--disable-gems", evaluator,
                       "--root", root, "--case", "ATOMIC-#{index}", "--fixtures", fixtures,
                       "--state-dir", state, unsetenv_others: true, chdir: root)
                end
              end
              gate_reader.close
              gate_writer.write("x" * pids.length)
              gate_writer.close
              statuses = pids.map { |pid| Process.wait2(pid).last }
              outcomes = 24.times.map { |index| JSON.parse(File.binread(File.join(state, "out-#{index}.json"))).fetch("outcome") }
              final_lines = File.foreach(ledger).count
              raise "atomic replay failed" unless outcomes.count("fixture_predicate_passed") == 1 && outcomes.count("held_attestation_replayed") == 23 && statuses.all?(&:success?) && final_lines == initial_lines + 1
            end
          end

          wave.call(0)
          wave.call(524_288)
          Dir.mktmpdir("traceweaver-metric-routing-") do |state|
            ledger = File.join(state, "attestation-replay-ledger.jsonl")
            File.binwrite(ledger, "x" * 1_048_577)
            environment = {"HOME" => state, "TMPDIR" => state, "LANG" => "C", "LC_ALL" => "C", "TZ" => "UTC", "TRACEWEAVER_OFFLINE" => "1"}
            success = system(environment, RbConfig.ruby, "--disable-gems", evaluator,
                             "--root", root, "--case", "OVERSIZED", "--fixtures", fixtures,
                             "--state-dir", state, out: File::NULL, err: File::NULL,
                             unsetenv_others: true, chdir: root)
            raise "oversized replay ledger did not fail closed" if success
          end
          puts "metric-routing atomic replay regression: PASS"
          RUBY

      - name: Deterministic metric-routing evidence-template regression
        run: plugins/traceweaver-core/skills/tw-auto/scripts/traceweaver-evaluate-metric-routing --root . --self-test evidence-templates

      - name: Terra native-child routing contract
        run: scripts/traceweaver-smoke-terra-routing

      - name: Mandatory authority graph contract and freshness
        run: |
          scripts/traceweaver-smoke-tw-graph
          plugins/traceweaver-core/skills/tw-graph/scripts/traceweaver-tw-graph check --root .

      - name: Derived semantic HTML preview
        run: scripts/traceweaver-smoke-semantic-html-preview

      - name: Codex discovery smoke
        run: TRACEWEAVER_HOST_RUNTIME_EXEC=0 scripts/traceweaver-smoke-codex-discovery

      - name: V&V definition smoke
        run: scripts/traceweaver-smoke-vv-define

      - name: SessionStart hook smoke
        run: scripts/traceweaver-smoke-hook-session-start

      - name: PreToolUse TDD gate hook smoke
        run: scripts/traceweaver-smoke-hook-pretooluse-tdd-gate

      - name: Antigravity discovery smoke
        run: scripts/traceweaver-smoke-antigravity-discovery

      - name: Generated-views drift smoke
        run: scripts/traceweaver-smoke-traceability-generated-views

      - name: Review-series convergence smoke
        run: scripts/traceweaver-smoke-review-series-convergence

      - name: Scoped-review regression smoke
        run: scripts/traceweaver-smoke-scoped-review

      - name: Workflow-profile regression smoke
        run: scripts/traceweaver-smoke-workflow-profile

      - name: Consolidated Sol delivery convergence smoke
        run: scripts/traceweaver-smoke-consolidated-convergence

      - name: No-publication regression smoke
        run: scripts/traceweaver-smoke-no-publication

      - name: TraceWeaver skill-behavior regression smoke
        run: TRACEWEAVER_TW_SKILL_BEHAVIOR_RUNTIME=0 scripts/traceweaver-smoke-tw-skill-behavior

      - name: Code traceability smoke
        run: scripts/traceweaver-smoke-code-traceability

      - name: Code trace-anchor authoring smoke
        run: scripts/traceweaver-smoke-code-trace-authoring

      - name: Release readiness and exact-merge-SHA regression smoke
        run: scripts/traceweaver-smoke-release-readiness

      - name: Controlled-publication smoke
        run: scripts/traceweaver-smoke-controlled-publication

      - name: Verify gate (baseline hash, bounded snapshot drift, intent-fidelity metrics)
        run: scripts/traceweaver-smoke-verify

      - name: Distilled-knowledge coverage gate (anti-stranding, drift, skill wiring)
        run: scripts/traceweaver-smoke-distilled-coverage
