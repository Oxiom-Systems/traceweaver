# TRACEWEAVER: file-role=v050-main-only-release-and-runtime-receipt; req=REQ-TW-122; trace=TRACE-TW-072; ver=VER-TW-092
name: Release on version bump

# Creates the `traceweaver-core--v<version>` git tag and a matching GitHub
# Release whenever a commit that bumps the plugin version lands on `main`
# (for example when a release PR is merged). The job is idempotent: if the tag
# for the current version already exists, it does nothing, so ordinary
# non-version commits never produce a release.

on:
  push:
    branches: [main]

# Avoid two pushes racing to create the same tag/release.
concurrency:
  group: release-on-version-bump
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        run: |
          set -euo pipefail
          # Every supported manifest is a release carrier. Keep this preflight
          # ahead of tag resolution so no partial manifest bump can mint a tag.
          bash scripts/traceweaver-check-release-manifest-versions
          plugin_version="$(jq -r '.version' plugins/traceweaver-core/.claude-plugin/plugin.json)"

          if [ -z "$plugin_version" ] || [ "$plugin_version" = "null" ]; then
            echo "::error::Could not read plugin version from plugins/traceweaver-core/.claude-plugin/plugin.json"
            exit 1
          fi

          previous_version=""
          if git rev-parse "$GITHUB_SHA^" >/dev/null 2>&1; then
            previous_manifest="$(git show "$GITHUB_SHA^:plugins/traceweaver-core/.claude-plugin/plugin.json" 2>/dev/null || true)"
            if [ -n "$previous_manifest" ]; then
              previous_version="$(printf '%s' "$previous_manifest" | jq -r '.version // empty')"
            fi
          fi

          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"
          echo "tag=traceweaver-core--v$plugin_version" >> "$GITHUB_OUTPUT"
          if [ "$plugin_version" = "$previous_version" ]; then
            tag="traceweaver-core--v$plugin_version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Plugin version remains $plugin_version and $tag exists; this ordinary main push is not a release event."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Plugin version remains $plugin_version but $tag is absent; resuming the interrupted release."
          else
            echo "Version changed from ${previous_version:-<none>} to $plugin_version."
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

          # A tag may be resolved only from a receipt that proves this exact
          # version has reconciled its prerequisite PRs, evidence, and review.
          receipt="docs/validation/traceweaver-plugin-$plugin_version-release-candidate.md"
          if [ ! -f "$receipt" ]; then
            echo "::error title=held_version_conflict::Missing release receipt $receipt"
            exit 1
          fi
          readiness_output="$(ruby scripts/traceweaver-check-release-readiness \
            --receipt "$receipt" \
            --version "$plugin_version" \
            --root . \
            --merge-sha "$GITHUB_SHA")"
          printf '%s\n' "$readiness_output"
          candidate_scope_digest="$(printf '%s\n' "$readiness_output" | sed -n 's/^release_candidate_scope_digest=//p')"
          if [ -z "$candidate_scope_digest" ]; then
            echo "::error title=held_version_conflict::Release candidate scope was not verified"
            exit 1
          fi

          echo "candidate_scope_digest=$candidate_scope_digest" >> "$GITHUB_OUTPUT"

      - name: Resolve exact tag and release state
        id: tag_state
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error title=held_tag_conflict::Tag $tag resolves to $tag_sha, not exact main SHA $GITHUB_SHA"
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              receipt_dir="$RUNNER_TEMP/traceweaver-existing-release-receipt"
              mkdir -p "$receipt_dir"
              if ! gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern release-runtime-receipt.json \
                --dir "$receipt_dir" \
                --clobber; then
                echo "::error title=held_release_metadata_write_unavailable::Existing release lacks its runtime evidence receipt"
                exit 1
              fi
              runtime_receipt="$receipt_dir/release-runtime-receipt.json"
              if ! ruby scripts/traceweaver-check-release-readiness \
                --runtime-receipt "$runtime_receipt" \
                --version "${{ steps.version.outputs.version }}" \
                --tag "$tag" \
                --merge-sha "$GITHUB_SHA" \
                --scope-digest "${{ steps.version.outputs.candidate_scope_digest }}" \
                --workflow-prefix "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"; then
                echo "::error title=held_release_metadata_write_unavailable::Existing release runtime evidence receipt is invalid"
                exit 1
              fi
              echo "Exact tag and GitHub Release already exist; idempotent no-op."
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Exact tag exists without a GitHub Release; publication will resume after CI proof."
              echo "release_exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error title=held_tag_conflict::GitHub Release $tag exists without its expected tag"
              exit 1
            fi
            echo "Tag $tag does not exist; a release will be created only after CI proof."
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.version.outputs.should_release == 'true' && steps.tag_state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Pull the section between "## <version> ..." and the next "## " header.
          awk -v ver="$version" '
            index($0, "## " ver " ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version; using a default note."
            printf 'TraceWeaver Core %s.\n' "$version" > release-notes.md
          fi

          echo "----- release notes -----"
          cat release-notes.md

      - name: Wait for exact-SHA smoke and CodeQL
        id: required_ci
        if: steps.version.outputs.should_release == 'true' && steps.tag_state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100" \
              > check-runs.json
            ruby scripts/traceweaver-evaluate-release-check-runs \
              --sha "$GITHUB_SHA" \
              --input check-runs.json \
              > required-ci.json
            state="$(jq -r .state required-ci.json)"
            if [ "$state" = ready ]; then
              cat required-ci.json
              echo "state=ready" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$state" = failed ]; then
              cat required-ci.json
              echo "::error title=held_ci_failed::A required exact-SHA check failed"
              exit 1
            fi
            if [ "$attempt" -eq 40 ]; then
              cat required-ci.json
              echo "::error title=held_ci_failed::Exact-SHA smoke and CodeQL did not both pass within 20 minutes"
              exit 1
            fi
            echo "Required exact-SHA checks are pending (attempt $attempt/40)."
            sleep 30
          done

      - name: Create runtime release receipt
        if: steps.version.outputs.should_release == 'true' && steps.tag_state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg merge_sha "$GITHUB_SHA" \
            --arg candidate_scope_digest "${{ steps.version.outputs.candidate_scope_digest }}" \
            --arg workflow_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile required_ci required-ci.json \
            '{
              schema: "traceweaver-release-runtime-receipt/1",
              version: $version,
              tag: $tag,
              merge_sha: $merge_sha,
              candidate_scope_digest: $candidate_scope_digest,
              workflow_url: $workflow_url,
              required_ci: $required_ci[0]
            }' > release-runtime-receipt.json

      - name: Create tag and GitHub Release
        if: steps.version.outputs.should_release == 'true' && steps.tag_state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          common_args=(
            --title "TraceWeaver Core ${{ steps.version.outputs.version }}"
            --notes-file release-notes.md
            release-runtime-receipt.json
          )
          if [ "${{ steps.tag_state.outputs.tag_exists }}" = true ]; then
            gh release create "$tag" --verify-tag "${common_args[@]}"
          else
            gh release create "$tag" --target "$GITHUB_SHA" "${common_args[@]}"
          fi
