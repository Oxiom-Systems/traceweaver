name: CodeQL
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '25 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    uses: Oxiom-Systems/traceweaver/.github/workflows/ci-codeql-recipe.yml@8a8b81c9f8718c00ad30cdfea2f0098ce1c3f3d4
    with:
      # Root flips this literal only after canaries and managed-default retirement.
      upload_results: false
