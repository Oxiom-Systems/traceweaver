name: CodeQL
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '25 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    uses: Oxiom-Systems/traceweaver/.github/workflows/ci-codeql-recipe.yml@2a2ae7154dab3381cdd833c4a99765bd22cec7be
    with:
      # Root flips this literal only after canaries and managed-default retirement.
      upload_results: false
